<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduLens — Your learning progress</title>
  <meta name="description" content="EduLens turns your AI study sessions into a clear picture of what you understand and what to review next." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232457A6'/%3E%3Cpath d='M6 12l10-5 10 5-10 5z M10 15v5c0 2 3 4 6 4s6-2 6-4v-5' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var t = localStorage.getItem("edulens_theme") || "system";
      var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.5A8 8 0 1121 12z"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16l4-5 3 3 5-7"/></symbol>
      <symbol id="i-quiz" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
      <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 2v5M15 2v5"/><path d="M6 7h12v4a6 6 0 01-12 0z"/><path d="M12 17v5"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></symbol>
      <symbol id="i-grad" viewBox="0 0 24 24"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 12v4c0 1.5 2.2 3 5 3s5-1.5 5-3v-4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <a class="brand" href="#/overview">
        <span class="brand-mark"><svg class="icon"><use href="#i-grad"/></svg></span>
        <span class="brand-text">EduLens</span>
      </a>
      <nav class="nav-group" aria-label="Main">
        <a class="nav-link" data-nav="overview" href="#/overview"><svg class="icon"><use href="#i-home"/></svg><span class="nav-label">Overview</span></a>
        <a class="nav-link" data-nav="sessions" href="#/sessions"><svg class="icon"><use href="#i-chat"/></svg><span class="nav-label">My Sessions</span></a>
        <a class="nav-link" data-nav="progress" href="#/progress"><svg class="icon"><use href="#i-chart"/></svg><span class="nav-label">My Progress</span></a>
        <a class="nav-link" data-nav="quizzes" href="#/quizzes"><svg class="icon"><use href="#i-quiz"/></svg><span class="nav-label">Quizzes</span></a>
      </nav>
      <div class="nav-sep"></div>
      <nav class="nav-group" aria-label="More">
        <a class="nav-link" data-nav="connect" href="#/connect"><svg class="icon"><use href="#i-plug"/></svg><span class="nav-label">Connect &amp; Ingest</span></a>
        <a class="nav-link" data-nav="settings" href="#/settings"><svg class="icon"><use href="#i-gear"/></svg><span class="nav-label">Settings</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="who">
          <span class="avatar" id="who-avatar">ST</span>
          <span class="who-text"><div class="who-name" id="who-name">student</div><div class="small muted">Student</div></span>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main-col">
      <header class="topbar">
        <button class="btn btn-ghost icon-btn menu-btn" id="menu-btn" aria-label="Open navigation menu"><svg class="icon"><use href="#i-menu"/></svg></button>
        <button class="btn btn-ghost icon-btn collapse-btn" id="collapse-btn" aria-label="Collapse sidebar" aria-pressed="false"><svg class="icon"><use href="#i-panel"/></svg></button>
        <div class="spacer"></div>
        <div class="student-select">
          <label class="small muted" for="student-select">Student</label>
          <select id="student-select" aria-label="Choose student"></select>
        </div>
        <button class="btn btn-primary" data-action="open-ingest"><svg class="icon"><use href="#i-plus"/></svg><span>Ingest session</span></button>
      </header>
      <main id="main" tabindex="-1" aria-live="polite" aria-busy="true"></main>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Quick navigation">
    <a data-nav="overview" href="#/overview"><svg class="icon"><use href="#i-home"/></svg>Overview</a>
    <a data-nav="sessions" href="#/sessions"><svg class="icon"><use href="#i-chat"/></svg>Sessions</a>
    <a data-nav="progress" href="#/progress"><svg class="icon"><use href="#i-chart"/></svg>Progress</a>
    <a data-nav="quizzes" href="#/quizzes"><svg class="icon"><use href="#i-quiz"/></svg>Quizzes</a>
    <button type="button" id="more-btn" aria-label="More: Connect and Settings"><svg class="icon"><use href="#i-more"/></svg>More</button>
  </nav>

  <dialog id="ingest-dialog" aria-labelledby="ingest-title"></dialog>
  <dialog id="quiz-dialog" aria-labelledby="quiz-title"></dialog>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="assets/app.js"></script>
</body>
</html>
